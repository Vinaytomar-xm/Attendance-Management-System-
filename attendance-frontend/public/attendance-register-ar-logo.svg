<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">Attendance Register AR Logo</title>
  <desc id="desc">Gold rounded square with dark navy AR monogram.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9A947"/>
      <stop offset="50%" stop-color="#C9953D"/>
      <stop offset="100%" stop-color="#B9822F"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9"
                    flood-color="#111827" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="78"
        fill="url(#gold)" filter="url(#shadow)"/>

  <text x="256" y="335"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190"
        font-weight="700"
        letter-spacing="-18"
        fill="#1F2A44">AR</text>
</svg>
